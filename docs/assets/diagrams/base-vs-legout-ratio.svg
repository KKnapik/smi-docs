<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Base versus Leg-Out body ratio</title>
  <desc id="d">A fixed Leg-Out body is compared with an accepted and rejected Base candle body at a 70 percent threshold.</desc>
  <style>
    .bg{fill:#0f172a}.panel{fill:#111c31;stroke:#334155;stroke-width:2}.grid{stroke:#243247}.h{fill:#f8fafc;font:700 30px system-ui}.sub{fill:#94a3b8;font:18px system-ui}.pt{fill:#f8fafc;font:700 23px system-ui}.txt{fill:#cbd5e1;font:16px system-ui}.lbl{fill:#e2e8f0;font:700 17px system-ui}.pass{fill:#22c55e;font:700 20px system-ui}.fail{fill:#fb7185;font:700 20px system-ui}.up{fill:#14b8a6;stroke:#2dd4bf;stroke-width:2}.base{fill:#64748b;stroke:#94a3b8;stroke-width:2}.wick{stroke:#94a3b8;stroke-width:4}.wickup{stroke:#2dd4bf;stroke-width:4}.limit{stroke:#fbbf24;stroke-width:3}.baseline{stroke:#64748b;stroke-width:2;stroke-dasharray:6 6}.gold{fill:#fde68a;font:700 16px system-ui}.chip{fill:#17233a;stroke:#475569;stroke-width:1.5}.direct{fill:#382e18;stroke:#f59e0b}.note{fill:#172033;stroke:#475569;stroke-width:1.5}
  </style>
  <rect class="bg" width="1200" height="680" rx="20"/>
  <text class="h" x="48" y="50">Max. Base Body Size (% of Leg-Out)</text>
  <text class="sub" x="48" y="80">Example threshold: each Base body ≤ 70% of the Leg-Out body</text>
  <rect class="chip direct" x="48" y="104" width="340" height="66" rx="12"/><text class="lbl" x="68" y="132">BASE — DIRECT CHECK</text><text class="txt" x="68" y="155">Every Base body is tested.</text>
  <rect class="chip" x="430" y="104" width="340" height="66" rx="12"/><text class="lbl" x="450" y="132">LEG-OUT — REFERENCE</text><text class="txt" x="450" y="155">Its body sets the size limit.</text>
  <rect class="chip" x="812" y="104" width="340" height="66" rx="12"/><text class="lbl" x="832" y="132">LEG-IN — NOT CHECKED</text><text class="txt" x="832" y="155">Uses separate settings.</text>
  <rect class="panel" x="48" y="194" width="540" height="380" rx="16"/><rect class="panel" x="612" y="194" width="540" height="380" rx="16"/>
  <text class="pt" x="76" y="232">PASS — compact Base</text><text class="pass" x="76" y="262">50% ≤ 70%</text>
  <text class="pt" x="640" y="232">FAIL — Base body too large</text><text class="fail" x="640" y="262">85% &gt; 70%</text>
  <line class="grid" x1="76" y1="326" x2="560" y2="326"/><line class="grid" x1="76" y1="454" x2="560" y2="454"/><line class="grid" x1="640" y1="326" x2="1124" y2="326"/><line class="grid" x1="640" y1="454" x2="1124" y2="454"/>
  <line class="baseline" x1="108" y1="452" x2="220" y2="452"/><line class="wick" x1="162" y1="366" x2="162" y2="466"/><rect class="base" x="136" y="382" width="52" height="70" rx="3"/>
  <line class="wickup" x1="390" y1="286" x2="390" y2="486"/><rect class="up" x="358" y="306" width="64" height="140" rx="3"/>
  <line class="limit" x1="220" y1="354" x2="220" y2="452"/><line class="limit" x1="210" y1="354" x2="230" y2="354"/><line class="limit" x1="210" y1="452" x2="230" y2="452"/><text class="gold" x="196" y="338">70% LIMIT</text>
  <text class="lbl" x="134" y="526">BASE</text><text class="lbl" x="352" y="526">LEG-OUT</text>
  <line class="baseline" x1="672" y1="452" x2="784" y2="452"/><line class="wick" x1="726" y1="311" x2="726" y2="481"/><rect class="base" x="700" y="333" width="52" height="119" rx="3"/>
  <line class="wickup" x1="954" y1="286" x2="954" y2="486"/><rect class="up" x="922" y="306" width="64" height="140" rx="3"/>
  <line class="limit" x1="784" y1="354" x2="784" y2="452"/><line class="limit" x1="774" y1="354" x2="794" y2="354"/><line class="limit" x1="774" y1="452" x2="794" y2="452"/><text class="gold" x="760" y="338">70% LIMIT</text>
  <text class="lbl" x="698" y="526">BASE</text><text class="lbl" x="916" y="526">LEG-OUT</text>
  <rect class="note" x="48" y="594" width="1104" height="58" rx="12"/><text class="txt" x="72" y="628">The parameter qualifies Base candles. The Leg-Out body is only the comparison reference; it is not qualified by this ratio.</text>
</svg>
