<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Intraday versus higher-timeframe detection thresholds</title>
  <desc id="d">The same formation fails stricter Intraday thresholds and passes more permissive higher-timeframe thresholds.</desc>
  <style>
    .bg{fill:#0f172a}.panel{fill:#111c31;stroke:#334155;stroke-width:2}.good{fill:#10251f;stroke:#22c55e;stroke-width:2}.bad{fill:#25161d;stroke:#fb7185;stroke-width:2}.h{fill:#f8fafc;font:700 30px system-ui}.sub{fill:#94a3b8;font:18px system-ui}.pt{fill:#f8fafc;font:700 24px system-ui}.txt{fill:#cbd5e1;font:16px system-ui}.lbl{fill:#e2e8f0;font:700 16px system-ui}.tiny{fill:#94a3b8;font:14px system-ui}.pass{fill:#22c55e;font:700 20px system-ui}.fail{fill:#fb7185;font:700 20px system-ui}.li{fill:#14b8a6;stroke:#2dd4bf;stroke-width:2}.base{fill:#64748b;stroke:#94a3b8;stroke-width:2}.lo{fill:#2563eb;stroke:#60a5fa;stroke-width:2}.wickli{stroke:#2dd4bf;stroke-width:3}.wick{stroke:#94a3b8;stroke-width:3}.wicklo{stroke:#60a5fa;stroke-width:4}.row{stroke:#334155}.note{fill:#172033;stroke:#475569;stroke-width:1.5}
  </style>
  <rect class="bg" width="1200" height="760" rx="20"/>
  <text class="h" x="48" y="50">Higher-Timeframe Detection — same formation, different thresholds</text>
  <text class="sub" x="48" y="80">Illustrative formation values are held constant; only the Intraday and HTF settings change</text>
  <rect class="bad" x="48" y="108" width="540" height="566" rx="16"/><rect class="good" x="612" y="108" width="540" height="566" rx="16"/>
  <text class="pt" x="76" y="146">INTRADAY THRESHOLDS</text><text class="fail" x="438" y="146">FAIL</text>
  <text class="pt" x="640" y="146">HTF THRESHOLDS</text><text class="pass" x="1040" y="146">PASS</text>
  <g>
    <line class="wickli" x1="126" y1="180" x2="126" y2="272"/><rect class="li" x="112" y="202" width="28" height="42"/>
    <line class="wick" x1="196" y1="220" x2="196" y2="270"/><rect class="base" x="185" y="234" width="22" height="20"/><line class="wick" x1="232" y1="216" x2="232" y2="272"/><rect class="base" x="221" y="232" width="22" height="22"/><line class="wick" x1="268" y1="222" x2="268" y2="274"/><rect class="base" x="257" y="238" width="22" height="18"/><line class="wick" x1="304" y1="218" x2="304" y2="272"/><rect class="base" x="293" y="234" width="22" height="21"/>
    <line class="wicklo" x1="390" y1="172" x2="390" y2="274"/><rect class="lo" x="372" y="194" width="36" height="36"/>
    <text class="tiny" x="98" y="294">LEG-IN</text><text class="tiny" x="216" y="294">BASE ×4</text><text class="tiny" x="362" y="294">LEG-OUT</text>
  </g>
  <g transform="translate(564 0)">
    <line class="wickli" x1="126" y1="180" x2="126" y2="272"/><rect class="li" x="112" y="202" width="28" height="42"/>
    <line class="wick" x1="196" y1="220" x2="196" y2="270"/><rect class="base" x="185" y="234" width="22" height="20"/><line class="wick" x1="232" y1="216" x2="232" y2="272"/><rect class="base" x="221" y="232" width="22" height="22"/><line class="wick" x1="268" y1="222" x2="268" y2="274"/><rect class="base" x="257" y="238" width="22" height="18"/><line class="wick" x1="304" y1="218" x2="304" y2="272"/><rect class="base" x="293" y="234" width="22" height="21"/>
    <line class="wicklo" x1="390" y1="172" x2="390" y2="274"/><rect class="lo" x="372" y="194" width="36" height="36"/>
    <text class="tiny" x="98" y="294">LEG-IN</text><text class="tiny" x="216" y="294">BASE ×4</text><text class="tiny" x="362" y="294">LEG-OUT</text>
  </g>
  <line class="row" x1="76" y1="316" x2="560" y2="316"/><line class="row" x1="640" y1="316" x2="1124" y2="316"/>
  <text class="lbl" x="76" y="346">Formation value</text><text class="lbl" x="300" y="346">Required</text><text class="lbl" x="640" y="346">Formation value</text><text class="lbl" x="864" y="346">Required</text>
  <text class="txt" x="76" y="382">Leg-Out body: 35%</text><text class="fail" x="300" y="382">≥ 40%</text><text class="txt" x="640" y="382">Leg-Out body: 35%</text><text class="pass" x="864" y="382">≥ 30%</text>
  <text class="txt" x="76" y="422">Leg-Out range: 0.60 ATR</text><text class="fail" x="300" y="422">≥ 0.70</text><text class="txt" x="640" y="422">Leg-Out range: 0.60 ATR</text><text class="pass" x="864" y="422">≥ 0.50</text>
  <text class="txt" x="76" y="462">Base/Leg-Out: 0.80</text><text class="fail" x="300" y="462">≤ 0.70</text><text class="txt" x="640" y="462">Base/Leg-Out: 0.80</text><text class="pass" x="864" y="462">≤ 0.85</text>
  <text class="txt" x="76" y="502">Visible Base candles: 4</text><text class="fail" x="300" y="502">max 3</text><text class="txt" x="640" y="502">Visible Base candles: 4</text><text class="pass" x="864" y="502">max 5</text>
  <text class="txt" x="76" y="542">Leg-In/Base: 1.40×</text><text class="fail" x="300" y="542">≥ 1.50×</text><text class="txt" x="640" y="542">Leg-In/Base: 1.40×</text><text class="pass" x="864" y="542">≥ 1.30×</text>
  <text class="txt" x="76" y="582">Leg-In body/range: 45%</text><text class="fail" x="300" y="582">≥ 50%</text><text class="txt" x="640" y="582">Leg-In body/range: 45%</text><text class="pass" x="864" y="582">≥ 40%</text>
  <text class="fail" x="76" y="630">Rejected as an Intraday formation</text><text class="pass" x="640" y="630">Accepted as higher-timeframe context</text>
  <rect class="note" x="48" y="696" width="1104" height="44" rx="12"/><text class="txt" x="72" y="724">HTF detection can change coverage and grading context; it does not redraw the boundaries of the primary Intraday zone.</text>
</svg>
