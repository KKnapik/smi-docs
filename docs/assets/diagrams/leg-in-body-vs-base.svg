<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Minimum Leg-In body size compared with the largest Base body</title>
  <desc id="d">Two same-direction Leg-In candles preserve the same body-to-range shape. A body of 126 units passes and a body of 91 units fails a target of 105 units derived from the largest Base body of 70 units.</desc>
  <style>
    .bg{fill:#0f172a}.panel{fill:#111c31;stroke:#334155;stroke-width:2}.h{fill:#f8fafc;font:700 30px system-ui}.sub{fill:#94a3b8;font:18px system-ui}.pt{fill:#f8fafc;font:700 23px system-ui}.txt{fill:#cbd5e1;font:16px system-ui}.small{fill:#94a3b8;font:14px system-ui}.lbl{fill:#e2e8f0;font:700 16px system-ui}.pass{fill:#22c55e;font:700 20px system-ui}.fail{fill:#fb7185;font:700 20px system-ui}.li{fill:#14b8a6;stroke:#2dd4bf;stroke-width:2}.base{fill:#64748b;stroke:#94a3b8;stroke-width:2}.largest{fill:#64748b;stroke:#fbbf24;stroke-width:3}.context{fill:#334155;stroke:#64748b;stroke-width:2}.wickli{stroke:#2dd4bf;stroke-width:4}.wick{stroke:#94a3b8;stroke-width:3}.wickcontext{stroke:#64748b;stroke-width:3}.measure{stroke:#60a5fa;stroke-width:3}.target{stroke:#fbbf24;stroke-width:3}.baseline{stroke:#64748b;stroke-width:2;stroke-dasharray:6 6}.blue{fill:#93c5fd;font:700 15px system-ui}.gold{fill:#fde68a;font:700 15px system-ui}.chip{fill:#17233a;stroke:#475569;stroke-width:1.5}.direct{fill:#10352f;stroke:#14b8a6}.reference{fill:#382e18;stroke:#f59e0b}.note{fill:#172033;stroke:#475569;stroke-width:1.5}
  </style>
  <rect class="bg" width="1200" height="700" rx="20"/>
  <text class="h" x="48" y="50">Min. Leg-In Body Size (× Largest Base Body)</text>
  <text class="sub" x="48" y="80">Example threshold: Leg-In body ≥ largest Base body × 1.50</text>
  <rect class="chip direct" x="48" y="104" width="340" height="66" rx="12"/><text class="lbl" x="68" y="132">LEG-IN — DIRECT CHECK</text><text class="txt" x="68" y="155">Absolute body size is tested.</text>
  <rect class="chip reference" x="430" y="104" width="340" height="66" rx="12"/><text class="lbl" x="450" y="132">BASE — REFERENCE</text><text class="txt" x="450" y="155">Largest Base body sets the target.</text>
  <rect class="chip" x="812" y="104" width="340" height="66" rx="12"/><text class="lbl" x="832" y="132">LEG-OUT — CONTEXT ONLY</text><text class="txt" x="832" y="155">It does not affect this test.</text>

  <rect class="panel" x="48" y="194" width="540" height="400" rx="16"/><rect class="panel" x="612" y="194" width="540" height="400" rx="16"/>
  <text class="pt" x="76" y="232">PASS — Leg-In body clears target</text><text class="pass" x="76" y="262">126 ÷ 70 = 1.80× ≥ 1.50×</text>
  <text class="pt" x="640" y="232">FAIL — Leg-In body is too small</text><text class="fail" x="640" y="262">91 ÷ 70 = 1.30× &lt; 1.50×</text>

  <line class="baseline" x1="92" y1="470" x2="548" y2="470"/>
  <line class="wickli" x1="140" y1="320" x2="140" y2="500"/><rect class="li" x="114" y="344" width="52" height="126" rx="3"/>
  <line class="measure" x1="198" y1="344" x2="198" y2="470"/><line class="measure" x1="188" y1="344" x2="208" y2="344"/><line class="measure" x1="188" y1="470" x2="208" y2="470"/><text class="blue" x="174" y="330">LEG-IN 126</text>
  <line class="target" x1="244" y1="365" x2="244" y2="470"/><line class="target" x1="234" y1="365" x2="254" y2="365"/><line class="target" x1="234" y1="470" x2="254" y2="470"/><text class="gold" x="216" y="350">TARGET 105</text>
  <line class="wick" x1="304" y1="410" x2="304" y2="486"/><rect class="base" x="293" y="425" width="22" height="45" rx="2"/><line class="wick" x1="340" y1="386" x2="340" y2="486"/><rect class="largest" x="328" y="400" width="24" height="70" rx="2"/><line class="wick" x1="376" y1="404" x2="376" y2="486"/><rect class="base" x="365" y="418" width="22" height="52" rx="2"/>
  <line class="wickcontext" x1="486" y1="326" x2="486" y2="494"/><rect class="context" x="458" y="350" width="56" height="120" rx="3"/>
  <text class="lbl" x="112" y="526">LEG-IN</text><text class="lbl" x="300" y="526">BASE ×3</text><text class="lbl" x="450" y="526">LEG-OUT</text><text class="gold" x="286" y="552">LARGEST BASE BODY = 70</text>

  <line class="baseline" x1="656" y1="470" x2="1112" y2="470"/>
  <line class="wickli" x1="704" y1="360" x2="704" y2="490"/><rect class="li" x="678" y="379" width="52" height="91" rx="3"/>
  <line class="measure" x1="762" y1="379" x2="762" y2="470"/><line class="measure" x1="752" y1="379" x2="772" y2="379"/><line class="measure" x1="752" y1="470" x2="772" y2="470"/><text class="blue" x="738" y="365">LEG-IN 91</text>
  <line class="target" x1="808" y1="365" x2="808" y2="470"/><line class="target" x1="798" y1="365" x2="818" y2="365"/><line class="target" x1="798" y1="470" x2="818" y2="470"/><text class="gold" x="780" y="350">TARGET 105</text>
  <line class="wick" x1="868" y1="410" x2="868" y2="486"/><rect class="base" x="857" y="425" width="22" height="45" rx="2"/><line class="wick" x1="904" y1="386" x2="904" y2="486"/><rect class="largest" x="892" y="400" width="24" height="70" rx="2"/><line class="wick" x1="940" y1="404" x2="940" y2="486"/><rect class="base" x="929" y="418" width="22" height="52" rx="2"/>
  <line class="wickcontext" x1="1050" y1="326" x2="1050" y2="494"/><rect class="context" x="1022" y="350" width="56" height="120" rx="3"/>
  <text class="lbl" x="676" y="526">LEG-IN</text><text class="lbl" x="864" y="526">BASE ×3</text><text class="lbl" x="1014" y="526">LEG-OUT</text><text class="gold" x="850" y="552">LARGEST BASE BODY = 70</text>

  <rect class="note" x="48" y="616" width="1104" height="58" rx="12"/><text class="txt" x="72" y="641">Both Leg-In candles keep the same direction and body/range shape. Only absolute Leg-In size changes.</text><text class="txt" x="72" y="663">The shared baseline makes the 105-unit requirement directly comparable with the 126-unit PASS and 91-unit FAIL bodies.</text>
</svg>
