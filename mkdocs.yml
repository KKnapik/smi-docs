site_name: SMI — Smart Money Indicator
site_description: Technical documentation for the Smart Money Indicator.
site_url: https://kknapik.github.io/smi-docs/
repo_url: https://github.com/KKnapik/smi-docs
repo_name: KKnapik/smi-docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: teal
      accent: green

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Intraday Indicator:
      - Overview: intraday/index.md
      - RAW Data Table Guide: intraday/raw-data-table.md
      - Zone Detection:
          - Overview: intraday/zone-detection/index.md
          - Settings at a Glance: intraday/all-settings.md
          - Min. Leg-Out Body Size (% of Range): intraday/zone-detection/erc-body-threshold.md
          - Max. Base Body Size (% of Leg-Out): intraday/zone-detection/base-vs-legout-ratio.md
          - Min. Leg-Out Range (ATR ×): intraday/zone-detection/erc-range-atr-multiplier.md
          - Avg. Price Range Period (Bars): intraday/zone-detection/atr-lookback-period.md
          - Max. Base Candles: intraday/zone-detection/max-base-candles.md
          - Min. Leg-In Body Size (× Largest Base Body): intraday/zone-detection/leg-in-body-vs-base.md
          - Min. Leg-In Body Size (% of Range): intraday/zone-detection/leg-in-body-range-min.md
      - Location Curve: intraday/location-curve.md
  - Swing Indicator: swing/index.md
  - Visual Guidelines: visual-guidelines.md
  - Glossary: glossary.md
