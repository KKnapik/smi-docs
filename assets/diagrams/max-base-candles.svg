<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Maximum Base Candles current behavior</title>
  <desc id="d">With the input set to four, formations with one, two, or three Base candles can pass, while a four-candle Base leaves no scan position for the Leg-In and fails.</desc>
  <style>
    .bg{fill:#0f172a}.panel{fill:#111c31;stroke:#334155;stroke-width:2}.badpanel{fill:#231827;stroke:#fb7185;stroke-width:2}.h{fill:#f8fafc;font:700 30px system-ui}.sub{fill:#94a3b8;font:18px system-ui}.pt{fill:#f8fafc;font:700 20px system-ui}.txt{fill:#cbd5e1;font:16px system-ui}.tiny{fill:#cbd5e1;font:700 13px system-ui}.pass{fill:#22c55e;font:700 18px system-ui}.fail{fill:#fb7185;font:700 18px system-ui}.li{fill:#14b8a6;stroke:#2dd4bf;stroke-width:2}.base{fill:#64748b;stroke:#94a3b8;stroke-width:2}.lo{fill:#159b7e;stroke:#44b69e;stroke-width:2}.wickli{stroke:#2dd4bf;stroke-width:3}.wick{stroke:#94a3b8;stroke-width:3}.wicklo{stroke:#44b69e;stroke-width:3}.slot{fill:#17233a;stroke:#475569;stroke-width:1.5;stroke-dasharray:5 4}.chip{fill:#382e18;stroke:#f59e0b;stroke-width:1.5}.lbl{fill:#e2e8f0;font:700 17px system-ui}.note{fill:#172033;stroke:#475569;stroke-width:1.5}
  </style>
  <rect class="bg" width="1200" height="680" rx="20"/>
  <text class="h" x="48" y="50">Max. Base Candles — current behavior</text>
  <text class="sub" x="48" y="80">Input value = 4: the scan window must contain the Base and still reach the preceding Leg-In</text>
  <rect class="chip" x="48" y="104" width="1104" height="66" rx="12"/><text class="lbl" x="68" y="132">BASE — DIRECT LENGTH CONTROL</text><text class="txt" x="68" y="155">One scan position must remain available to identify the Leg-In; Leg-Out strength is not changed.</text>
  <rect class="panel" x="48" y="198" width="252" height="360" rx="16"/><rect class="panel" x="332" y="198" width="252" height="360" rx="16"/><rect class="panel" x="616" y="198" width="252" height="360" rx="16"/><rect class="badpanel" x="900" y="198" width="252" height="360" rx="16"/>
  <text class="pt" x="72" y="232">1 Base candle</text><text class="pass" x="72" y="260">ACCEPTED</text>
  <line class="wickli" x1="92" y1="326" x2="92" y2="440"/><rect class="li" x="78" y="350" width="28" height="66" rx="2"/><line class="wick" x1="158" y1="372" x2="158" y2="430"/><rect class="base" x="146" y="390" width="24" height="20"/><line class="wicklo" x1="242" y1="306" x2="242" y2="436"/><rect class="lo" x="226" y="326" width="32" height="86"/>
  <text class="tiny" x="73" y="480">LEG-IN</text><text class="tiny" x="140" y="480">BASE</text><text class="tiny" x="217" y="480">LEG-OUT</text><text class="txt" x="72" y="522">2 scan slots unused</text>
  <text class="pt" x="356" y="232">2 Base candles</text><text class="pass" x="356" y="260">ACCEPTED</text>
  <line class="wickli" x1="370" y1="326" x2="370" y2="440"/><rect class="li" x="356" y="350" width="28" height="66" rx="2"/><line class="wick" x1="426" y1="372" x2="426" y2="430"/><rect class="base" x="414" y="390" width="24" height="20"/><line class="wick" x1="466" y1="368" x2="466" y2="432"/><rect class="base" x="454" y="386" width="24" height="22"/><line class="wicklo" x1="534" y1="306" x2="534" y2="436"/><rect class="lo" x="518" y="326" width="32" height="86"/>
  <text class="tiny" x="351" y="480">LEG-IN</text><text class="tiny" x="416" y="480">BASE ×2</text><text class="tiny" x="509" y="480">LEG-OUT</text><text class="txt" x="356" y="522">1 scan slot unused</text>
  <text class="pt" x="640" y="232">3 Base candles</text><text class="pass" x="640" y="260">ACCEPTED</text>
  <line class="wickli" x1="646" y1="326" x2="646" y2="440"/><rect class="li" x="632" y="350" width="28" height="66" rx="2"/><line class="wick" x1="694" y1="372" x2="694" y2="430"/><rect class="base" x="682" y="390" width="24" height="20"/><line class="wick" x1="730" y1="368" x2="730" y2="432"/><rect class="base" x="718" y="386" width="24" height="22"/><line class="wick" x1="766" y1="374" x2="766" y2="434"/><rect class="base" x="754" y="392" width="24" height="18"/><line class="wicklo" x1="824" y1="306" x2="824" y2="436"/><rect class="lo" x="808" y="326" width="32" height="86"/>
  <text class="tiny" x="627" y="480">LEG-IN</text><text class="tiny" x="692" y="480">BASE ×3</text><text class="tiny" x="799" y="480">LEG-OUT</text><text class="txt" x="640" y="522">All 4 slots used</text>
  <text class="pt" x="924" y="232">4 Base candles</text><text class="fail" x="924" y="260">REJECTED</text>
  <rect class="slot" x="918" y="302" width="46" height="142" rx="8"/><text class="tiny" x="924" y="372">NO</text><text class="tiny" x="920" y="390">SLOT</text>
  <line class="wick" x1="984" y1="372" x2="984" y2="430"/><rect class="base" x="972" y="390" width="24" height="20"/><line class="wick" x1="1020" y1="368" x2="1020" y2="432"/><rect class="base" x="1008" y="386" width="24" height="22"/><line class="wick" x1="1056" y1="374" x2="1056" y2="434"/><rect class="base" x="1044" y="392" width="24" height="18"/><line class="wick" x1="1092" y1="370" x2="1092" y2="432"/><rect class="base" x="1080" y="388" width="24" height="21"/><line class="wicklo" x1="1130" y1="306" x2="1130" y2="436"/><rect class="lo" x="1116" y="326" width="28" height="86"/>
  <text class="tiny" x="912" y="480">LEG-IN</text><text class="tiny" x="1005" y="480">BASE ×4</text><text class="tiny" x="1107" y="480">LEG-OUT</text><text class="txt" x="924" y="522">Leg-In cannot be found</text>
  <rect class="note" x="48" y="584" width="1104" height="68" rx="12"/><text class="txt" x="72" y="612">This documents the detector's current behavior: Max. Base Candles = 4 allows up to three visible Base candles.</text><text class="txt" x="72" y="637">The displayed input is one higher because the final scan position is needed to identify the Leg-In.</text>
</svg>
