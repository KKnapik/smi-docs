<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Exact Leg-Out Body Cover and ATR range checks</title>
  <desc id="desc">Three complete Demand formations isolate a passing Leg-Out, a Body Cover rejection and a Range versus ATR rejection using exact label values.</desc>
  <style>.bg{fill:#121820}.panel{fill:#18212b;stroke:#33404d;stroke-width:2}.bad{fill:#241b20;stroke:#a84b55;stroke-width:2}.h{fill:#f4eee7;font:700 31px system-ui}.sub{fill:#ad9f91;font:18px system-ui}.pt{fill:#f4eee7;font:700 21px system-ui}.txt{fill:#d4cbc2;font:16px system-ui}.small{fill:#b9aea4;font:14px system-ui}.pass{fill:#63c69f;font:700 19px system-ui}.fail{fill:#ef7d78;font:700 19px system-ui}.green{fill:#159b7e;stroke:#44b69e;stroke-width:2}.base{fill:#7b6a60;stroke:#aa9687;stroke-width:2}.wickg{stroke:#44b69e;stroke-width:3}.wickb{stroke:#aa9687;stroke-width:3}.label{fill:#166f63;stroke:#46b9a1;stroke-width:1.5}.lt{fill:#fff;font:600 13px ui-monospace,monospace}.zone{fill:#173f3c;fill-opacity:.58;stroke:#4cab9b;stroke-width:1.5}.rule{fill:#211d1a;stroke:#806b59;stroke-width:1.5}.gold{fill:#e8be83;font:700 16px system-ui}</style>
  <rect class="bg" width="1500" height="780" rx="22"/>
  <text class="h" x="46" y="52">Leg-Out — check Body Cover first, then complete Range</text>
  <text class="sub" x="46" y="84">Inputs used in every panel: Min. Body Size = 70% · Min. Range from RAW Table = 120.00</text>
  <rect class="panel" x="46" y="118" width="448" height="584" rx="16"/><rect class="bad" x="526" y="118" width="448" height="584" rx="16"/><rect class="bad" x="1006" y="118" width="448" height="584" rx="16"/>
  <text class="pt" x="70" y="154">A. Both Leg-Out checks pass</text><text class="pass" x="70" y="184">ZONE DETECTION CONTINUES</text>
  <text class="pt" x="550" y="154">B. Body Cover fails</text><text class="fail" x="550" y="184">REJECTED BEFORE BASE SCAN</text>
  <text class="pt" x="1030" y="154">C. Complete Range fails</text><text class="fail" x="1030" y="184">REJECTED BEFORE BASE SCAN</text>
  <!-- panel A -->
  <rect class="zone" x="76" y="456" width="364" height="74"/><line class="wickg" x1="112" y1="340" x2="112" y2="522"/><rect class="green" x="94" y="382" width="36" height="102"/><line class="wickb" x1="190" y1="430" x2="190" y2="520"/><rect class="base" x="174" y="454" width="32" height="30"/><line class="wickb" x1="242" y1="424" x2="242" y2="520"/><rect class="base" x="226" y="450" width="32" height="34"/><line class="wickg" x1="354" y1="254" x2="354" y2="520"/><rect class="green" x="326" y="286" width="56" height="192"/>
  <rect class="label" x="270" y="216" width="166" height="74" rx="8"/><text class="lt" x="284" y="239">R: 150.00</text><text class="lt" x="284" y="259">B: 120.00</text><text class="lt" x="284" y="279">B%C: 80.0%</text>
  <rect class="rule" x="72" y="560" width="376" height="104" rx="10"/><text class="gold" x="90" y="588">80.0% is at least 70%</text><text class="gold" x="90" y="615">150.00 is at least 120.00</text><text class="txt" x="90" y="644">Both independent Leg-Out conditions pass.</text>
  <!-- panel B -->
  <rect class="zone" x="556" y="456" width="364" height="74"/><line class="wickg" x1="592" y1="340" x2="592" y2="522"/><rect class="green" x="574" y="382" width="36" height="102"/><line class="wickb" x1="670" y1="430" x2="670" y2="520"/><rect class="base" x="654" y="454" width="32" height="30"/><line class="wickb" x1="722" y1="424" x2="722" y2="520"/><rect class="base" x="706" y="450" width="32" height="34"/><line class="wickg" x1="834" y1="254" x2="834" y2="520"/><rect class="green" x="806" y="328" width="56" height="138"/>
  <rect class="label" x="750" y="216" width="166" height="74" rx="8"/><text class="lt" x="764" y="239">R: 150.00</text><text class="lt" x="764" y="259">B: 103.50</text><text class="lt" x="764" y="279">B%C: 69.0%</text>
  <rect class="rule" x="552" y="560" width="376" height="104" rx="10"/><text class="fail" x="570" y="590">69.0% is below 70%</text><text class="gold" x="570" y="617">Range 150.00 would pass</text><text class="txt" x="570" y="644">One failed Leg-Out condition is enough.</text>
  <!-- panel C -->
  <rect class="zone" x="1036" y="456" width="364" height="74"/><line class="wickg" x1="1072" y1="340" x2="1072" y2="522"/><rect class="green" x="1054" y="382" width="36" height="102"/><line class="wickb" x1="1150" y1="430" x2="1150" y2="520"/><rect class="base" x="1134" y="454" width="32" height="30"/><line class="wickb" x1="1202" y1="424" x2="1202" y2="520"/><rect class="base" x="1186" y="450" width="32" height="34"/><line class="wickg" x1="1314" y1="312" x2="1314" y2="520"/><rect class="green" x="1286" y="332" width="56" height="168"/>
  <rect class="label" x="1230" y="236" width="166" height="74" rx="8"/><text class="lt" x="1244" y="259">R: 119.00</text><text class="lt" x="1244" y="279">B: 95.20</text><text class="lt" x="1244" y="299">B%C: 80.0%</text>
  <rect class="rule" x="1032" y="560" width="376" height="104" rx="10"/><text class="gold" x="1050" y="590">80.0% passes the body check</text><text class="fail" x="1050" y="617">119.00 is below 120.00</text><text class="txt" x="1050" y="644">The departure is too small for current ATR.</text>
  <text class="small" x="46" y="742">For a historical candidate, stop Bar Replay immediately after the Leg-Out. The RAW Table minimum uses the replay endpoint's ATR, not a stored threshold for every old zone.</text>
</svg>
