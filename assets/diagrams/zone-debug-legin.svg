<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Leg-In Body Cover strict minimum inside complete formations</title>
  <desc id="desc">Two complete Demand formations compare a Leg-In with fifty point one percent Body Cover that passes against exactly fifty percent that fails.</desc>
  <style>.bg{fill:#121820}.panel{fill:#18212b;stroke:#33404d;stroke-width:2}.bad{fill:#241b20;stroke:#a84b55;stroke-width:2}.h{fill:#f4eee7;font:700 31px system-ui}.sub{fill:#ad9f91;font:18px system-ui}.pt{fill:#f4eee7;font:700 21px system-ui}.txt{fill:#d4cbc2;font:16px system-ui}.pass{fill:#63c69f;font:700 19px system-ui}.fail{fill:#ef7d78;font:700 19px system-ui}.green{fill:#159b7e;stroke:#44b69e;stroke-width:2}.base{fill:#7b6a60;stroke:#aa9687;stroke-width:2}.wickg{stroke:#44b69e;stroke-width:3}.wickb{stroke:#aa9687;stroke-width:3}.labelg{fill:#166f63;stroke:#46b9a1;stroke-width:1.5}.labelbad{fill:#9b3f48;stroke:#ef7d78;stroke-width:1.5}.lt{fill:#fff;font:600 13px ui-monospace,monospace}.zone{fill:#173f3c;fill-opacity:.58;stroke:#4cab9b;stroke-width:1.5}.rule{fill:#211d1a;stroke:#806b59;stroke-width:1.5}.gold{fill:#e8be83;font:700 16px system-ui}</style>
  <rect class="bg" width="1400" height="760" rx="22"/>
  <text class="h" x="48" y="52">Leg-In — use the first non-Base candle immediately before the Base</text>
  <text class="sub" x="48" y="84">Input used below: Min. Leg-In Body Size = 50% · the comparison is strict</text>
  <rect class="panel" x="48" y="118" width="632" height="560" rx="16"/><rect class="bad" x="720" y="118" width="632" height="560" rx="16"/>
  <text class="pt" x="74" y="154">A. Leg-In is above the minimum</text><text class="pass" x="74" y="184">FORMATION MAY CONTINUE</text>
  <text class="pt" x="746" y="154">B. Leg-In equals the minimum</text><text class="fail" x="746" y="184">FORMATION IS REJECTED</text>
  <!-- left -->
  <rect class="zone" x="86" y="470" width="544" height="74"/><line class="wickg" x1="160" y1="320" x2="160" y2="536"/><rect class="green" x="134" y="374" width="52" height="108"/>
  <rect class="labelg" x="78" y="222" width="166" height="74" rx="8"/><text class="lt" x="92" y="245">R: 100.00</text><text class="lt" x="92" y="265">B: 50.10</text><text class="lt" x="92" y="285">B%C: 50.1%</text>
  <line class="wickb" x1="330" y1="414" x2="330" y2="534"/><rect class="base" x="306" y="450" width="48" height="34"/><line class="wickb" x1="402" y1="410" x2="402" y2="536"/><rect class="base" x="378" y="446" width="48" height="38"/><line class="wickg" x1="560" y1="250" x2="560" y2="532"/><rect class="green" x="530" y="284" width="60" height="218"/>
  <rect class="rule" x="86" y="570" width="544" height="76" rx="10"/><text class="gold" x="106" y="600">50.1% is above the 50% minimum</text><text class="txt" x="106" y="628">Leg-In colour classifies RBR or DBR; colour does not reject it.</text>
  <!-- right -->
  <rect class="zone" x="758" y="470" width="544" height="74"/><line class="wickg" x1="832" y1="320" x2="832" y2="536"/><rect class="green" x="806" y="374" width="52" height="108"/>
  <rect class="labelbad" x="750" y="222" width="166" height="74" rx="8"/><text class="lt" x="764" y="245">R: 100.00</text><text class="lt" x="764" y="265">B: 50.00</text><text class="lt" x="764" y="285">B%C: 50.0%</text>
  <line class="wickb" x1="1002" y1="414" x2="1002" y2="534"/><rect class="base" x="978" y="450" width="48" height="34"/><line class="wickb" x1="1074" y1="410" x2="1074" y2="536"/><rect class="base" x="1050" y="446" width="48" height="38"/><line class="wickg" x1="1232" y1="250" x2="1232" y2="532"/><rect class="green" x="1202" y="284" width="60" height="218"/>
  <rect class="rule" x="758" y="570" width="544" height="76" rx="10"/><text class="fail" x="778" y="600">Exactly 50.0% is not above the minimum</text><text class="txt" x="778" y="628">The Base was found, but the required preceding Leg-In was not.</text>
  <text class="txt" x="48" y="722">Leg-In has no ATR-size requirement and is not compared with Base body size.</text>
</svg>
