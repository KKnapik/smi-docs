<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Immediate validation after a closed Leg-Out</title>
  <desc id="desc">Demand and Supply examples show the next candle staying outside proximal for activation or crossing proximal for immediate rejection.</desc>
  <style>.bg{fill:#121820}.panel{fill:#18212b;stroke:#33404d;stroke-width:2}.bad{fill:#241b20;stroke:#a84b55;stroke-width:2}.h{fill:#f4eee7;font:700 31px system-ui}.sub{fill:#ad9f91;font:18px system-ui}.pt{fill:#f4eee7;font:700 18px system-ui}.txt{fill:#d4cbc2;font:15px system-ui}.pass{fill:#63c69f;font:700 17px system-ui}.fail{fill:#ef7d78;font:700 17px system-ui}.green{fill:#159b7e;stroke:#44b69e;stroke-width:2}.red{fill:#d65a5a;stroke:#e57b73;stroke-width:2}.base{fill:#7b6a60;stroke:#aa9687;stroke-width:2}.wickg{stroke:#44b69e;stroke-width:3}.wickr{stroke:#e57b73;stroke-width:3}.wickb{stroke:#aa9687;stroke-width:3}.zoneD{fill:#173f3c;fill-opacity:.58;stroke:#4cab9b;stroke-width:1.5}.zoneS{fill:#4c292d;fill-opacity:.58;stroke:#d26a6a;stroke-width:1.5}.prox{stroke:#e8be83;stroke-width:2;stroke-dasharray:7 5}.gold{fill:#e8be83;font:700 15px system-ui}.tag{fill:#211d1a;stroke:#806b59;stroke-width:1.5}</style>
  <rect class="bg" width="1500" height="780" rx="22"/>
  <text class="h" x="46" y="52">Validation candle — the bar after Leg-Out decides immediate activation</text>
  <text class="sub" x="46" y="84">The Leg-Out is already closed. The next candle must not cross the new proximal boundary.</text>
  <rect class="panel" x="46" y="118" width="334" height="566" rx="15"/><rect class="bad" x="404" y="118" width="334" height="566" rx="15"/><rect class="panel" x="762" y="118" width="334" height="566" rx="15"/><rect class="bad" x="1120" y="118" width="334" height="566" rx="15"/>
  <text class="pt" x="66" y="152">DEMAND — ACTIVATE</text><text class="pass" x="66" y="179">Validation Low 121</text>
  <text class="pt" x="424" y="152">DEMAND — REJECT</text><text class="fail" x="424" y="179">Validation Low 119</text>
  <text class="pt" x="782" y="152">SUPPLY — ACTIVATE</text><text class="pass" x="782" y="179">Validation High 179</text>
  <text class="pt" x="1140" y="152">SUPPLY — REJECT</text><text class="fail" x="1140" y="179">Validation High 181</text>
  <!-- Demand pass -->
  <rect class="zoneD" x="68" y="466" width="286" height="80"/><line class="prox" x1="68" y1="466" x2="354" y2="466"/><text class="gold" x="78" y="454">PROXIMAL = 120</text>
  <line class="wickg" x1="102" y1="366" x2="102" y2="536"/><rect class="green" x="84" y="402" width="36" height="96"/><line class="wickb" x1="172" y1="430" x2="172" y2="536"/><rect class="base" x="154" y="462" width="36" height="30"/><line class="wickg" x1="246" y1="264" x2="246" y2="528"/><rect class="green" x="222" y="294" width="48" height="210"/><line class="wickg" x1="320" y1="250" x2="320" y2="464"/><rect class="green" x="300" y="294" width="40" height="132"/>
  <rect class="tag" x="70" y="574" width="282" height="70" rx="9"/><text class="txt" x="84" y="600">121 stays above proximal 120</text><text class="pass" x="84" y="628">NORMAL ZONE ACTIVATES</text>
  <!-- Demand fail -->
  <rect class="zoneD" x="426" y="466" width="286" height="80"/><line class="prox" x1="426" y1="466" x2="712" y2="466"/><text class="gold" x="436" y="454">PROXIMAL = 120</text>
  <line class="wickg" x1="460" y1="366" x2="460" y2="536"/><rect class="green" x="442" y="402" width="36" height="96"/><line class="wickb" x1="530" y1="430" x2="530" y2="536"/><rect class="base" x="512" y="462" width="36" height="30"/><line class="wickg" x1="604" y1="264" x2="604" y2="528"/><rect class="green" x="580" y="294" width="48" height="210"/><line class="wickr" x1="678" y1="292" x2="678" y2="478"/><rect class="red" x="658" y="326" width="40" height="108"/>
  <rect class="tag" x="428" y="574" width="282" height="70" rx="9"/><text class="txt" x="442" y="600">119 trades below proximal 120</text><text class="fail" x="442" y="628">NORMAL ZONE IS REJECTED</text>
  <!-- Supply pass -->
  <rect class="zoneS" x="784" y="282" width="286" height="80"/><line class="prox" x1="784" y1="362" x2="1070" y2="362"/><text class="gold" x="794" y="386">PROXIMAL = 180</text>
  <line class="wickr" x1="818" y1="292" x2="818" y2="462"/><rect class="red" x="800" y="330" width="36" height="96"/><line class="wickb" x1="888" y1="292" x2="888" y2="398"/><rect class="base" x="870" y="330" width="36" height="30"/><line class="wickr" x1="962" y1="300" x2="962" y2="564"/><rect class="red" x="938" y="324" width="48" height="210"/><line class="wickr" x1="1036" y1="364" x2="1036" y2="578"/><rect class="red" x="1016" y="402" width="40" height="132"/>
  <rect class="tag" x="786" y="574" width="282" height="70" rx="9"/><text class="txt" x="800" y="600">179 stays below proximal 180</text><text class="pass" x="800" y="628">NORMAL ZONE ACTIVATES</text>
  <!-- Supply fail -->
  <rect class="zoneS" x="1142" y="282" width="286" height="80"/><line class="prox" x1="1142" y1="362" x2="1428" y2="362"/><text class="gold" x="1152" y="386">PROXIMAL = 180</text>
  <line class="wickr" x1="1176" y1="292" x2="1176" y2="462"/><rect class="red" x="1158" y="330" width="36" height="96"/><line class="wickb" x1="1246" y1="292" x2="1246" y2="398"/><rect class="base" x="1228" y="330" width="36" height="30"/><line class="wickr" x1="1320" y1="300" x2="1320" y2="564"/><rect class="red" x="1296" y="324" width="48" height="210"/><line class="wickg" x1="1394" y1="348" x2="1394" y2="528"/><rect class="green" x="1374" y="382" width="40" height="108"/>
  <rect class="tag" x="1144" y="574" width="282" height="70" rx="9"/><text class="txt" x="1158" y="600">181 trades above proximal 180</text><text class="fail" x="1158" y="628">NORMAL ZONE IS REJECTED</text>
  <text class="txt" x="46" y="732">A rejected candidate may be retained briefly as a hidden LoL-only fact when its distal remains intact. It is not a normal active zone.</text>
</svg>
